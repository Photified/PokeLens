name: Update prices and publish PokéLens
on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '37 22 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pokelens-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore last successful price snapshot
        uses: actions/cache@v4
        with:
          path: |
            data/catalog.json
            data/vision-v2
          key: pokelens-dinov2-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pokelens-dinov2-v2-
      - name: Refresh all sets and prices
        run: python scripts/sync_catalog.py
      - name: Install image-index dependencies
        run: python -m pip install numpy==2.2.6 pillow==11.3.0 onnxruntime==1.22.0
      - name: Index newly added card images
        run: python scripts/sync_vision.py
      - name: Check recognition rules
        run: node --test tests/recognition.test.js
      - name: Package app and source download
        run: python scripts/package.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
